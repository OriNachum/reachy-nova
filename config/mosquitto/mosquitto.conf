# Localhost-only broker.
#
# Both listeners bind 127.0.0.1 explicitly: the runtime, the harness and the
# dashboard all live on the same device, so nothing needs to reach this broker
# from the network. That binding is what makes `allow_anonymous true`
# acceptable — the loopback interface is the access control. Do NOT widen a
# listener to 0.0.0.0 without adding a password_file/ACL at the same time:
# unauthenticated, an open listener lets anyone on the LAN both read every
# sense the robot publishes and inject speech into it.
listener 1883 127.0.0.1
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

# WebSocket listener for debugging (loopback only, same reasoning as above).
listener 9001 127.0.0.1
protocol websockets
