# Nervous System Rules Configuration
# Maps (source, type) pairs to baseline priority, urgency, and LLM evaluation settings.
#
# Optional per-entry fields (t6):
#   voice: silent | brief | free
#     A hint to Nova about how much it should say about the event — never
#     about whether the event happened; the inject still always fires.
#     Defaults to "free" when absent. reachy_nova/harness/bus.py's
#     route_event appends a marker to the rendered inject text:
#       silent -> " (quiet: do not speak about this)"
#       brief  -> " (react briefly if at all)"
#       free   -> no marker
#   sense: <class>  (e.g. pat, face, sound, vision)
#     Names the sensory class an entry belongs to, for future dedupe/fusion
#     logic across the several rule keys that can carry the same physical
#     sense (e.g. rule/fire:pat-acknowledge and pat/level1 are both "pat").
#     Schema-only in this task — rule_for() exposes it unchanged; nothing
#     yet reads it to suppress or merge events.

# Default rule for unknown (source, type) pairs
default:
  priority: NORMAL
  urgency: DEFERRABLE
  llm_evaluate: true
  voice: free

# Rules keyed by source/type
rules:
  # --- Tracking events ---
  tracking/snap_detected:
    priority: HIGH
    urgency: IMMEDIATE
    llm_evaluate: false
    inject_template: "You heard a sharp snap nearby."

  tracking/person_detected:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "Someone just came into view."

  tracking/person_lost:
    priority: LOW
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "The person you were looking at walked away."

  tracking/mode_changed:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  tracking/face_recognized:
    # Fired by TrackingManager.update_face_recognition() via _fire_event,
    # republished under source "tracking" by main.py's on_tracking_event.
    # Same payload shape as face/face_recognized below (id/name/score).
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You notice {name} is here."

  tracking/pat_level1:
    # Reflex already handled in-process: main.py's on_tracking_event injects
    # directly on pat_level1/2, so the nervous system need not re-inject.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  tracking/pat_level2:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  tracking/audio_direction:
    # Rate-limited DoA bearing event {bearing_deg, label, speech_active}
    # (reachy_nova/tracking.py, TrackingManager.update_doa). Background
    # signal — direction rides along with speech/vision events, not a
    # standalone interrupt.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Speech events ---
  speech/speech_detected:
    # Speech-capture lane onset event (payload includes a backtracked clip
    # path, transcript, duration_seconds and onset timestamp).
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You just heard: {transcript}"

  # --- Face events ---
  face/face_recognized:
    # Fired directly by main.py's on_face_match (FaceRecognition engine
    # callback), payload {id, name, score}.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You notice {name} is here."

  # --- Vision events ---
  vision/vision_description:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "Right now you see: {description}"

  vision/analysis_started:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Slack events ---
  slack/slack_mention:
    priority: HIGH
    urgency: IMMEDIATE
    llm_evaluate: false
    inject_template: "{user} just mentioned you on Slack: {text}"

  slack/slack_message:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "New Slack message from {user}: {text}"

  slack/slack_dm:
    priority: HIGH
    urgency: IMMEDIATE
    llm_evaluate: false
    inject_template: "{user} sent you a direct message on Slack: {text}"

  slack/slack_reaction:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Browser events ---
  browser/task_completed:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You found this: {result}"

  browser/progress:
    priority: LOW
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "Still looking... {message}"

  browser/task_started:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Memory events ---
  memory/query_result:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You remember: {result}"

  memory/store_result:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  memory/startup_context:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "Things you know: {context}"

  memory/context:
    # The harness memory leg (reachy_nova/harness/memory_leg.py) routes every
    # qq knowledge context here — NovaMemory.on_context never reaches
    # sonic.inject_text directly. Background knowledge, not news: DEFERRABLE,
    # so it rides along rather than interrupting.
    priority: NORMAL
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "Something you know: {text}"

  memory/result:
    # The answer to a memory query the leg dispatched (NovaMemory.on_result).
    # Nova asked for this, so it is worth saying — but still only in the words
    # this template renders.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You remember: {text}"

  # --- Emotion events ---
  emotions/wound_created:
    priority: HIGH
    urgency: NOW
    llm_evaluate: false
    inject_template: "That really hurt."

  emotions/wound_healed:
    priority: NORMAL
    urgency: DEFERRABLE
    llm_evaluate: false

  emotions/mood_changed:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Heartbeat ---
  heartbeat/tick:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Skill-forge events ---
  forge/staged:
    # A generated skill passed validation and is staged for activation.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  forge/activated:
    # A staged skill was hot-registered into the live skill set.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  forge/rejected:
    # Validation failed or the forge endpoint was unreachable/unparseable —
    # surfaced at NORMAL/NOW so a failed forge attempt is never silent.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "A new skill idea didn't pass its safety check: {reason}"

  # --- Runtime bus events (reachy-mini-cli's symbolic runtime) --------------
  # These arrive over MQTT as reachy/events/{source}/{type} and are keyed here
  # by the same "source/type" pair (reachy_nova/harness/bus.py). {source} is
  # the runtime block type and {type} its action — see the runtime feed half
  # of reachy-mini-cli's docs/export-schema.md. Only the events that tell Nova
  # something it cannot work out on its own carry an inject_template; the
  # LOW/BACKGROUND ones are observed (dashboard/logs) and never spoken about.

  sense/snapshot:
    # The 50Hz engine's perception snapshot. NOT subscribed by default
    # (NOVA_BUS_SOURCES defaults to rule,intent,motion): unfiltered it floods —
    # upstream measured 187 cues in ~40s from this stream alone. Nova already
    # has its own senses; this is the runtime's copy of them.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  rule/fire:
    # A deterministic reflex fired on the robot's body — something moved that
    # Nova did not decide, so it needs to know it happened. Quiet/situational
    # on purpose (t6): the robot should not narrate its own reflex mechanism
    # ("the '{rule}' reflex fired" was the pre-t6 text, observed live
    # 2026-08-26 — see tests/test_rules_coverage.py for the before-state).
    # voice: silent means this is context only — never spoken about — but it
    # still always produces an inject; see bus.py route_event/VOICE_MARKERS.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: silent
    inject_template: "(body cue: {rule})"

  # Per-rule rule/fire overrides (reachy_nova/harness/bus.py rule_for): a key
  # "rule/fire:<rule-id>" wins over the generic rule/fire entry for that one
  # runtime rule, falling back to it for every other rule id. This is how a
  # known reflex gets a SENSORY inject instead of the generic mechanical one.

  "rule/fire:pat-acknowledge":
    # The runtime's shipped touch reflex (default_rules.toml). LIVE FINDING
    # 2026-08-12: discrete reachy/events/pat/* topics do not exist on-device —
    # touch reaches Nova as this rule's fire, so this is THE pat sense today.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    inject_template: "(someone is petting you)"

  "rule/fire:nova-face-noticed":
    # The harness's own standing overlay rule (installed at startup by
    # reachy_nova/harness/app.py ensure_face_rule): the face cue has no shipped
    # runtime rule, so without this fire a recognised face never crosses the
    # bus. The rule/fire payload names the rule, not the person — identity
    # stays with the runtime's own face store.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: face
    inject_template: "(a familiar face is in view)"

  rule/suppress:
    # A reflex was considered and held back (cooldown/rearming/inhibited).
    # Bookkeeping, not news.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/declare:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/update:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/clear:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/applied:
    # A standing symbolic goal took effect in the runtime.
    priority: NORMAL
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "Your standing intention '{name}' is now in effect."

  intent/blocked:
    # The runtime refused a standing goal — a failure Nova must not miss,
    # otherwise it keeps believing it asked for something that never landed.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "The runtime blocked your intention '{name}'."

  motion/admit:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  motion/evict:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  motion/goto:
    # Goto-lane lifecycle (admitted/done/cancelled). Movement Nova can feel
    # through its own senses — logged, not narrated.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Runtime pat/face/vision events (t7) ----------------------------------
  # Discrete touch/sight senses published by reachy-mini-cli under their own
  # block types (reachy/events/pat/#, reachy/events/face/#,
  # reachy/events/vision/#) — as opposed to the continuous pat/face fields
  # already riding inside sense/snapshot above. IMPORTANT CAVEAT: these exact
  # topic/type names are NOT YET LIVE-CONFIRMED on the device (pat sense is
  # live, face waits on the vision extra) — a later task confirms and adjusts
  # this block, a config-only change, once the wire names are pinned down.
  # The tracking/pat_level1(2) and face/face_recognized entries above are
  # Nova's OWN reflex/engine senses and are unrelated to this block.

  pat/level1:
    # A light touch — the runtime's discrete pat block, one step up from the
    # in-process reflex Nova already handles via rule/fire:pat-acknowledge.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    inject_template: "(someone is patting you gently)"

  pat/level2:
    # A firmer or sustained touch — same discrete block, stronger contact.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    inject_template: "(someone is patting you more firmly)"

  pat/detected:
    # A touch event with no level distinction the runtime bothered to make.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    inject_template: "(someone is touching you)"

  face/recognized:
    # The runtime's own discrete face block, payload {id, name, score} — the
    # same shape as tracking/face_recognized and face/face_recognized above,
    # just published over the runtime's bus instead of Nova's own engine.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You notice {name} is here."

  face/unknown:
    # A face was detected but not matched to anyone Nova knows.
    priority: LOW
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "You notice someone you don't recognize."

  vision/description:
    # The runtime's own discrete scene-description block — distinct from
    # vision/vision_description above (Nova's own Nova 2 Lite frame
    # analysis), same shape.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "Right now you see: {description}"
