# Nervous System Rules Configuration
# Maps (source, type) pairs to baseline priority, urgency, and LLM evaluation settings.
#
# Optional per-entry fields (t6):
#   voice: silent | brief | free | none
#     A hint to Nova about how much it should say about the event.
#     silent/brief/free still ALWAYS fire an inject — never about whether the
#     event happened, only how much to say about it. Defaults to "free" when
#     absent. reachy_nova/harness/bus.py's route_event appends a marker to
#     the rendered inject text:
#       silent -> " (quiet: do not speak about this)"
#       brief  -> " (react briefly if at all)"
#       free   -> no marker
#       none   -> no marker (see below — none never reaches route_event's
#                 caller as a delivered inject at all)
#     "none" is the one exception to "the inject still always fires" above:
#     the cue is recorded in SenseHistory (so `recall_senses` can still
#     explain "why did you move?") but is NEVER delivered to Nova's voice
#     model — no on_inject call, no marker. Use it for events that are pure
#     plumbing/mechanism Nova should never narrate even quietly (t14).
#   sense: <class>  (e.g. pat, face, sound, vision)
#     Names the sensory class an entry belongs to — SenseHistory's semantic
#     classification only (what `recall_senses` reports this event as). It is
#     NOT consulted for inject dedupe (see `dedupe:` below) — two entries can
#     share a `sense` (e.g. pat/level1 and pat/level2 are both "pat") without
#     collapsing into one inject, because escalation from one level to the
#     next is a distinct event the rules' own definition recognizes.
#   dedupe: <key>
#     The bus's dedupe IDENTITY (reachy_nova/harness/bus.py dedupe_key_for):
#     when set, two entries sharing the same `dedupe` key collapse into one
#     inject within the window (NOVA_SENSE_DEDUPE_S, default 10s) regardless
#     of which fires first. Absent, an entry dedupes by its own exact
#     resolved key ("<source>/<type>:<rule>" or "<source>/<type>") — never
#     guessed from `sense`. Used on the two pat rule/fire overrides below
#     (`dedupe: pat-touch`) so the runtime's shipped reflex and the Kiro
#     overlay's own fire collapse into one inject for the same physical pat,
#     while the raw pat/level1 -> pat/level2 escalation (a distinct sensory
#     event) is never suppressed just because both carry `sense: pat`.
#   react: lite  (t13)
#     Opts this entry's cue into the Nova 2 Lite reaction tier: instead of
#     delivering the rendered template directly, reachy_nova/harness/bus.py's
#     NovaBus hands the BASE rendered text (no voice/quiet marker yet) to the
#     wired LiteReactor as both its `cue` and `template`, and whatever plan
#     text the reactor eventually delivers gets the entry's own voice/quiet
#     markers applied the same as a plain template render would — so the
#     inject Nova actually receives, and what SenseHistory records, is always
#     the DELIVERED text. Ignored (falls back to the plain template path,
#     byte-identical to an entry without this field) when no reactor is
#     wired (NOVA_LITE_REACTIONS=0 or the bus was built with reactor=None).
#     NEVER applies to a `voice: none` entry: `_handle_message` routes those
#     to SenseHistory-only delivery before `react` is ever consulted, so a
#     `voice: none` cue never reaches Lite regardless of this field.

# Default rule for unknown (source, type) pairs
default:
  priority: NORMAL
  urgency: DEFERRABLE
  llm_evaluate: true
  voice: free

# Rules keyed by source/type
rules:
  # --- Tracking events ---
  tracking/snap_detected:
    priority: HIGH
    urgency: IMMEDIATE
    llm_evaluate: false
    inject_template: "You heard a sharp snap nearby."

  tracking/person_detected:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "Someone just came into view."

  tracking/person_lost:
    priority: LOW
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "The person you were looking at walked away."

  tracking/mode_changed:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  tracking/face_recognized:
    # Fired by TrackingManager.update_face_recognition() via _fire_event,
    # republished under source "tracking" by main.py's on_tracking_event.
    # Same payload shape as face/face_recognized below (id/name/score).
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You notice {name} is here."

  tracking/pat_level1:
    # Reflex already handled in-process: main.py's on_tracking_event injects
    # directly on pat_level1/2, so the nervous system need not re-inject.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  tracking/pat_level2:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  tracking/audio_direction:
    # Rate-limited DoA bearing event {bearing_deg, label, speech_active}
    # (reachy_nova/tracking.py, TrackingManager.update_doa). Background
    # signal — direction rides along with speech/vision events, not a
    # standalone interrupt.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Speech events ---
  speech/speech_detected:
    # Speech-capture lane onset event (payload includes a backtracked clip
    # path, transcript, duration_seconds and onset timestamp).
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You just heard: {transcript}"

  # --- Face events ---
  face/face_recognized:
    # Fired directly by main.py's on_face_match (FaceRecognition engine
    # callback), payload {id, name, score}.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You notice {name} is here."

  # --- Vision events ---
  vision/vision_description:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "Right now you see: {description}"

  vision/analysis_started:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Slack events ---
  slack/slack_mention:
    priority: HIGH
    urgency: IMMEDIATE
    llm_evaluate: false
    inject_template: "{user} just mentioned you on Slack: {text}"

  slack/slack_message:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "New Slack message from {user}: {text}"

  slack/slack_dm:
    priority: HIGH
    urgency: IMMEDIATE
    llm_evaluate: false
    inject_template: "{user} sent you a direct message on Slack: {text}"

  slack/slack_reaction:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Browser events ---
  browser/task_completed:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You found this: {result}"

  browser/progress:
    priority: LOW
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "Still looking... {message}"

  browser/task_started:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Memory events ---
  memory/query_result:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You remember: {result}"

  memory/store_result:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  memory/startup_context:
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "Things you know: {context}"

  memory/context:
    # The harness memory leg (reachy_nova/harness/memory_leg.py) routes every
    # qq knowledge context here — NovaMemory.on_context never reaches
    # sonic.inject_text directly. Background knowledge, not news: DEFERRABLE,
    # so it rides along rather than interrupting.
    priority: NORMAL
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "Something you know: {text}"

  memory/result:
    # The answer to a memory query the leg dispatched (NovaMemory.on_result).
    # Nova asked for this, so it is worth saying — but still only in the words
    # this template renders.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "You remember: {text}"

  # --- Emotion events ---
  emotions/wound_created:
    priority: HIGH
    urgency: NOW
    llm_evaluate: false
    inject_template: "That really hurt."

  emotions/wound_healed:
    priority: NORMAL
    urgency: DEFERRABLE
    llm_evaluate: false

  emotions/mood_changed:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Heartbeat ---
  heartbeat/tick:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Skill-forge events ---
  forge/staged:
    # A generated skill passed validation and is staged for activation.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  forge/activated:
    # A staged skill was hot-registered into the live skill set.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  forge/rejected:
    # Validation failed or the forge endpoint was unreachable/unparseable —
    # surfaced at NORMAL/NOW so a failed forge attempt is never silent.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    inject_template: "A new skill idea didn't pass its safety check: {reason}"

  # --- Runtime bus events (reachy-mini-cli's symbolic runtime) --------------
  # These arrive over MQTT as reachy/events/{source}/{type} and are keyed here
  # by the same "source/type" pair (reachy_nova/harness/bus.py). {source} is
  # the runtime block type and {type} its action — see the runtime feed half
  # of reachy-mini-cli's docs/export-schema.md. Only the events that tell Nova
  # something it cannot work out on its own carry an inject_template; the
  # LOW/BACKGROUND ones are observed (dashboard/logs) and never spoken about.

  sense/snapshot:
    # The 50Hz engine's perception snapshot. NOT subscribed by default
    # (NOVA_BUS_SOURCES defaults to rule,intent,motion): unfiltered it floods —
    # upstream measured 187 cues in ~40s from this stream alone. Nova already
    # has its own senses; this is the runtime's copy of them.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  rule/fire:
    # A deterministic reflex fired on the robot's body — something moved that
    # Nova did not decide, so it needs to know it happened. Quiet/situational
    # on purpose (t6): the robot should not narrate its own reflex mechanism
    # ("the '{rule}' reflex fired" was the pre-t6 text, observed live
    # 2026-08-26 — see tests/test_rules_coverage.py for the before-state).
    # voice: silent means this is context only — never spoken about — but it
    # still always produces an inject; see bus.py route_event/VOICE_MARKERS.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: silent
    inject_template: "(body cue: {rule})"

  # Per-rule rule/fire overrides (reachy_nova/harness/bus.py rule_for): a key
  # "rule/fire:<rule-id>" wins over the generic rule/fire entry for that one
  # runtime rule, falling back to it for every other rule id. This is how a
  # known reflex gets a SENSORY inject instead of the generic mechanical one.

  "rule/fire:pat-acknowledge":
    # The runtime's shipped touch reflex (default_rules.toml). LIVE FINDING
    # 2026-08-12: discrete reachy/events/pat/* topics do not exist on-device —
    # touch reaches Nova as this rule's fire, so this is THE pat sense today.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    dedupe: pat-touch
    react: lite
    inject_template: "(someone is petting you)"

  "rule/fire:nova-face-noticed":
    # The harness's own standing overlay rule (installed at startup by
    # reachy_nova/harness/app.py ensure_face_rule): the face cue has no shipped
    # runtime rule, so without this fire a recognised face never crosses the
    # bus. The rule/fire payload names the rule, not the person — identity
    # stays with the runtime's own face store.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: silent
    sense: face
    react: lite
    inject_template: "(a familiar face is in view)"

  "rule/fire:nova-pat-cheer":
    # A second, Kiro-authored overlay rule that ALSO fires on a pat (live
    # finding 2026-08-26: one physical pat produced two injects ~8s apart —
    # the shipped pat-acknowledge fire and this overlay's own fire). Same
    # `dedupe: pat-touch` key as pat-acknowledge (F3 fix) so NovaBus's
    # per-key dedupe (t7/F3, bus.py) collapses both into one inject
    # regardless of which rule name arrives first — narrower than `sense`,
    # which stays "pat" on both purely for SenseHistory classification.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    dedupe: pat-touch
    react: lite
    inject_template: "(someone is petting you)"

  "rule/fire:look-toward-sound":
    # The runtime's own reflex that turns the head toward a sound source
    # (LIVE FINDING L3/follow-up above: this is the rule that kept re-firing
    # every ~10s while a face lock inhibited it). LIVE FOLLOW-UP (2026-08-26
    # 19:05-19:08): even at `voice: silent` this fire made Sonic call
    # look_at_sound and narrate "I'm still following that sound" every time —
    # pure body-reflex mechanism Nova should never act or comment on. t14:
    # `voice: none` records it (recall_senses can still say "you glanced
    # toward a sound") without ever handing the model a sentence to react to.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: none
    sense: sound
    inject_template: "(you glanced toward a sound)"

  rule/suppress:
    # A reflex was considered and held back (cooldown/rearming/inhibited).
    # Bookkeeping, not news.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/declare:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/update:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/clear:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  intent/applied:
    # A standing symbolic goal took effect in the runtime.
    #
    # LIVE FINDING L3 (2026-08-26 18:26-18:31): `{name}` is the intent KIND,
    # not a thing a person said — so every quiet arm (set_inhibition, the
    # mute/unmute pair behind stay_silent) narrated "Your standing intention
    # 'set_inhibition' is now in effect." out loud. `voice: silent` (t6) still
    # let this READ as a quiet marker on the rendered text, but Sonic kept
    # narrating it anyway — LIVE FOLLOW-UP (2026-08-26 19:05-19:08, same
    # device): with `silent`, Sonic still said "a standing intention called
    # 'set_inhibition' is now active" out loud after end_silence. `silent`
    # only hints; it never stops the model from having something to say. t14
    # moves this to `voice: none`: still recorded (recall_senses can explain
    # it), but the model is never given the sentence to begin with.
    priority: NORMAL
    urgency: DEFERRABLE
    llm_evaluate: false
    voice: none
    inject_template: "Your standing intention '{name}' is now in effect."

  intent/blocked:
    # The runtime refused a standing goal — a failure Nova must not miss,
    # otherwise it keeps believing it asked for something that never landed.
    #
    # LIVE FINDING L3: while a face lock was held, the RUNTIME's own
    # `look-toward-sound` rule kept re-admitting `orient-to-sound` and kept
    # being refused by the standing inhibition, ~once every 10 s. Rendered
    # with `{name}` (= the intent kind, `set_inhibition`) that read as "The
    # runtime blocked your intention 'set_inhibition'." — misleading (it is
    # the BODY's reflex being held back, exactly as Nova asked, not Nova's
    # own request failing) and relentless.
    #
    # The wire payload for an intent event is {t, ts, tick, action, name,
    # payload} (reachy-mini-cli reachy/export/runtime.py runtime_to_jsonl);
    # the blocked behaviour's own name is NOT a top-level field — the
    # IntentDriver emits `behavior=` but `_intent_status_event` keeps only
    # kind/cmd_id/result/reason/goal, and `payload` is nested. So the text
    # names no behaviour at all rather than rendering an empty `{behavior}`.
    # `dedupe: reflex-held` collapses the ~10 s repeat into one record per
    # dedupe window either way.
    #
    # LIVE FOLLOW-UP (2026-08-26 19:05-19:08, same device as L3): with
    # `voice: silent`, every `(body cue: look-toward-sound)` rule/fire made
    # Sonic call look_at_sound and say "I'm still following that sound" —
    # `silent` marks the text as quiet, it doesn't stop the model choosing to
    # act/speak on it. t14 moves this to `voice: none`: recorded for
    # `recall_senses`, never handed to the model at all.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: none
    dedupe: reflex-held
    inject_template: "(a body reflex was held back)"

  motion/admit:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  motion/evict:
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  motion/goto:
    # Goto-lane lifecycle (admitted/done/cancelled). Movement Nova can feel
    # through its own senses — logged, not narrated.
    priority: LOW
    urgency: BACKGROUND
    llm_evaluate: false

  # --- Runtime pat/face/vision events (t7) ----------------------------------
  # Discrete touch/sight senses published by reachy-mini-cli under their own
  # block types (reachy/events/pat/#, reachy/events/face/#,
  # reachy/events/vision/#) — as opposed to the continuous pat/face fields
  # already riding inside sense/snapshot above. IMPORTANT CAVEAT: these exact
  # topic/type names are NOT YET LIVE-CONFIRMED on the device (pat sense is
  # live, face waits on the vision extra) — a later task confirms and adjusts
  # this block, a config-only change, once the wire names are pinned down.
  # The tracking/pat_level1(2) and face/face_recognized entries above are
  # Nova's OWN reflex/engine senses and are unrelated to this block.

  pat/level1:
    # A light touch — the runtime's discrete pat block, one step up from the
    # in-process reflex Nova already handles via rule/fire:pat-acknowledge.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    react: lite
    inject_template: "(someone is patting you gently)"

  pat/level2:
    # A firmer or sustained touch — same discrete block, stronger contact.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    react: lite
    inject_template: "(someone is patting you more firmly)"

  pat/detected:
    # A touch event with no level distinction the runtime bothered to make.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: brief
    sense: pat
    react: lite
    inject_template: "(someone is touching you)"

  face/recognized:
    # The runtime's own discrete face block, payload {id, name, score} — the
    # same shape as tracking/face_recognized and face/face_recognized above,
    # just published over the runtime's bus instead of Nova's own engine.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    react: lite
    inject_template: "You notice {name} is here."

  face/unknown:
    # A face was detected but not matched to anyone Nova knows.
    priority: LOW
    urgency: DEFERRABLE
    llm_evaluate: false
    inject_template: "You notice someone you don't recognize."

  vision/description:
    # The runtime's own discrete scene-description block — distinct from
    # vision/vision_description above (Nova's own Nova 2 Lite frame
    # analysis), same shape.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: true
    inject_template: "Right now you see: {description}"

  # --- Gaze-lock lifecycle (t13) ---------------------------------------------
  # Published by the runtime while a lock_face gaze lock (task t9's
  # LOCK_FACE/RELEASE_FACE intents) is held. The lock itself PERSISTS across a
  # face-lost — this is a "can't currently see them" notice, not a release.

  motion/face-lost:
    # Payload {id, absent_s}: the locked face has been out of view for
    # absent_s seconds, but the lock is still held (the runtime keeps trying).
    # Worth a quiet situational cue, not a whole reaction.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    # Demoted from brief to none on 2026-09-06: with the CM4 ticking at ~7 Hz
    # under face detection, the runtime reported face-lost every 20-40 s while
    # the person sat there, and every notice became a spoken "they wandered
    # off". History-only until reachy-mini-cli #179 lowers the detection load.
    voice: none
    sense: face
    inject_template: "(the person you were watching is out of view)"

  motion/lock-released:
    # Payload {id, reason: requested|mind-offline|max-hold} — the runtime
    # actually dropped the lock. Silent: this is bookkeeping for the harness's
    # own local lock belief (reachy_nova/harness/lock_state.py), not something
    # worth narrating out loud.
    priority: NORMAL
    urgency: NOW
    llm_evaluate: false
    voice: silent
    inject_template: "(you stopped following the person: {reason})"
